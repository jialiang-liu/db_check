name: All DB Diff

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_and_compare:
    runs-on: ubuntu-latest

    concurrency:
      group: db-diff-${{ github.repository }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - region: cn
            region_upper: CN
            ver_secret: WT_VER_URL
            ver_method: POST
            ver_body: '{"regionCode":"cn"}'
            ver_jq: '.data.truthVersion'
            db_secret: CN_DB_URL
            var_name: LAST_VERSION_CN

          - region: jp
            region_upper: JP
            ver_secret: JP_VER_URL
            ver_method: GET
            ver_body: ''
            ver_jq: '.TruthVersion'
            db_secret: JP_DB_URL
            var_name: LAST_VERSION_JP

          - region: tw
            region_upper: TW
            ver_secret: WT_VER_URL
            ver_method: POST
            ver_body: '{"regionCode":"tw"}'
            ver_jq: '.data.truthVersion'
            db_secret: TW_DB_URL
            var_name: LAST_VERSION_TW

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Fetch latest version
        id: fetch_version
        env:
          VER_URL: ${{ secrets[matrix.ver_secret] }}
          VER_METHOD: ${{ matrix.ver_method }}
          VER_BODY: ${{ matrix.ver_body }}
          VER_JQ: ${{ matrix.ver_jq }}
        run: |
          set -euo pipefail

          if [ "$VER_METHOD" = "POST" ]; then
            RESP=$(curl --fail --retry 3 -sS -X POST \
              -H "Content-Type: application/json" \
              -d "$VER_BODY" \
              "$VER_URL")
          else
            RESP=$(curl --fail --retry 3 -sS "$VER_URL")
          fi

          CURRENT_VERSION=$(printf '%s' "$RESP" | jq -r "$VER_JQ")
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: version_check
        env:
          CURRENT_VERSION: ${{ steps.fetch_version.outputs.version }}
          STORED_VERSION: ${{ vars[matrix.var_name] }}
        run: |
          set -euo pipefail

          echo "Current Version: $CURRENT_VERSION"
          echo "Stored Version: $STORED_VERSION"

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "null" ]; then
            echo "No valid version info, skipping database comparison"
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_VERSION" = "$STORED_VERSION" ]; then
            echo "Version unchanged, skipping database comparison"
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed, proceeding with database comparison"
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.version_check.outputs.should_continue == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest DB file
        if: steps.version_check.outputs.should_continue == 'true'
        env:
          DB_URL: ${{ secrets[matrix.db_secret] }}
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "latest_${REGION}.db" "$DB_URL"

      - name: Compare databases
        if: steps.version_check.outputs.should_continue == 'true'
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          python compare_databases.py "database/latest_${REGION}.db" "latest_${REGION}.db"

      - name: Upload differences
        if: steps.version_check.outputs.should_continue == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-differences_${{ matrix.region }}_${{ steps.fetch_version.outputs.version }}
          path: detailed_changes.json

      - name: Prepare diff result
        if: steps.version_check.outputs.should_continue == 'true'
        env:
          REGION: ${{ matrix.region }}
          VERSION: ${{ steps.fetch_version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p results
          mv detailed_changes.json "results/${REGION}_${VERSION}.json"

      - name: Send Diff JSON via Curl
        if: steps.version_check.outputs.should_continue == 'true'
        env:
          AUTH_TOKEN: ${{ secrets.POST_AUTH_TOKEN }}
          TARGET_URL: ${{ secrets.POST_TARGET_URL }}
          REGION: ${{ matrix.region }}
          VERSION: ${{ steps.fetch_version.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Auth-Token: $AUTH_TOKEN" \
            -F "file=@results/${REGION}_${VERSION}.json;filename=${REGION}_${VERSION}.json" \
            "$TARGET_URL"

      - name: Update database files
        if: steps.version_check.outputs.should_continue == 'true'
        env:
          REGION: ${{ matrix.region }}
          REGION_UPPER: ${{ matrix.region_upper }}
          VERSION: ${{ steps.fetch_version.outputs.version }}
          STORED_VERSION: ${{ vars[matrix.var_name] }}
        run: |
          set -euo pipefail

          mkdir -p database

          if [ -f "database/latest_${REGION}.db" ]; then
            rm -f "database/previous_${REGION}.db"
            mv "database/latest_${REGION}.db" "database/previous_${REGION}.db"
          fi

          mv "latest_${REGION}.db" "database/latest_${REGION}.db"

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A database "results/${REGION}_${VERSION}.json"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ${REGION_UPPER} database files ${STORED_VERSION:-unknown} -> ${VERSION}"
            git push
          fi

      - name: Update stored version
        if: steps.version_check.outputs.should_continue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          VAR_NAME: ${{ matrix.var_name }}
          VERSION: ${{ steps.fetch_version.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/variables/${VAR_NAME}" \
            -f name="$VAR_NAME" \
            -f value="$VERSION"